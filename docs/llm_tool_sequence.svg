eight='600' fill='#343a40' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>system prompt (today, rules) + history + message + 6 tool schemas</text><path d='M 692 310 L 418 310' fill='none' stroke='#7048e8' stroke-width='2' stroke-dasharray='7 5' marker-end='url(#arrow)'/><text x='555.0' y='301' font-size='14' font-weight='600' fill='#7048e8' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>tool_calls: geocode_place, get_weather(&quot;Manali&quot;), get_public_holidays, get_destination_guide ×4</text><path d='M 418 370 L 962 370' fill='none' stroke='#343a40' stroke-width='2' marker-end='url(#arrow)'/><text x='690.0' y='361' font-size='14' font-weight='600' fill='#343a40' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>run tool calls</text><path d='M 978 425 L 1262 425' fill='none' stroke='#343a40' stroke-width='2' marker-end='url(#arrow)'/><text x='1120.0' y='416' font-size='14' font-weight='600' fill='#343a40' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>geocode &quot;Manali&quot;</text><path d='M 1262 480 L 978 480' fill='none' stroke='#e8590c' stroke-width='2' stroke-dasharray='7 5' marker-end='url(#arrow)'/><text x='1120.0' y='471' font-size='14' font-weight='600' fill='#e8590c' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>two exact matches: Tamil Nadu (35,248) · Himachal Pradesh (8,096)</text><path d='M 962 540 L 418 540' fill='none' stroke='#c92a2a' stroke-width='2' stroke-dasharray='7 5' marker-end='url(#arrow)'/><text x='690.0' y='531' font-size='14' font-weight='600' fill='#c92a2a' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>{ok: false, error: ambiguous_place, options: [Tamil Nadu, Himachal Pradesh]}</text><text x='690.0' y='559' font-size='12.5' font-weight='400' fill='#495057' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>no weather fetched for a guess · holidays: no_data · guide: &quot;… in Central Himachal Pradesh&quot;</text><rect x='25' y='420' width='300' height='96' rx='8' fill='#fff5f5' stroke='#e03131' stroke-width='2'/><text x='37' y='444' font-size='13.5' font-weight='400' fill='#c92a2a' text-anchor='start' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>Unexpected response 1: two towns</text><text x='37' y='464' font-size='13.5' font-weight='400' fill='#c92a2a' text-anchor='start' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>called Manali; the bigger one is a</text><text x='37' y='484' font-size='13.5' font-weight='400' fill='#c92a2a' text-anchor='start' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>Chennai suburb. The tool refuses</text><text x='37' y='504' font-size='13.5' font-weight='400' fill='#c92a2a' text-anchor='start' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>to guess instead of picking it.</text><path d='M 418 605 L 692 605' fill='none' stroke='#343a40' stroke-width='2' marker-end='url(#arrow)'/><text x='555.0' y='596' font-size='14' font-weight='600' fill='#343a40' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>tool results appended to the conversation</text><path d='M 692 665 L 418 665' fill='none' stroke='#7048e8' stroke-width='2' stroke-dasharray='7 5' marker-end='url(#arrow)'/><text x='555.0' y='656' font-size='14' font-weight='600' fill='#7048e8' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>get_weather(&quot;Manali, Himachal Pradesh, India&quot;) · estimate_trip_budget(dates, 1 traveller)</text><text x='555.0' y='684' font-size='12.5' font-weight='400' fill='#495057' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>follows the hint: retry with the qualified name that fits &quot;mountains&quot;</text><path d='M 418 730 L 962 730' fill='none' stroke='#343a40' stroke-width='2' marker-end='url(#arrow)'/><text x='690.0' y='721' font-size='14' font-weight='600' fill='#343a40' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>run tool calls</text><path d='M 978 785 L 1262 785' fill='none' stroke='#343a40' stroke-width='2' marker-end='url(#arrow)'/><text x='1120.0' y='776' font-size='14' font-weight='600' fill='#343a40' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>forecast?  16-18 Nov is beyond the 16-day horizon</text><text x='1120.0' y='804' font-size='12.5' font-weight='400' fill='#495057' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>→ Historical API: same dates in 2025</text><path d='M 1262 840 L 978 840' fill='none' stroke='#e8590c' stroke-width='2' stroke-dasharray='7 5' marker-end='url(#arrow)'/><text x='1120.0' y='831' font-size='14' font-weight='600' fill='#e8590c' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>observed daily weather</text><rect x='25' y='750' width='300' height='96' rx='8' fill='#fff5f5' stroke='#e03131' stroke-width='2'/><text x='37' y='774' font-size='13.5' font-weight='400' fill='#c92a2a' text-anchor='start' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>Unexpected response 2: the forecast</text><text x='37' y='794' font-size='13.5' font-weight='400' fill='#c92a2a' text-anchor='start' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>API cannot serve dates 2 months</text><text x='37' y='814' font-size='13.5' font-weight='400' fill='#c92a2a' text-anchor='start' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>ahead. The tool uses last year&#x27;s</text><text x='37' y='834' font-size='13.5' font-weight='400' fill='#c92a2a' text-anchor='start' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>observations, labelled as a proxy.</text><path d='M 962 895 L 418 895' fill='none' stroke='#2f9e44' stroke-width='2' stroke-dasharray='7 5' marker-end='url(#arrow)'/><text x='690.0' y='886' font-size='14' font-weight='600' fill='#2f9e44' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>{place: Manali, Himachal Pradesh, source: historical_proxy, avg max 18.2 °C, min -0.2 °C}</text><text x='690.0' y='914' font-size='12.5' font-weight='400' fill='#495057' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>budget: nights computed from dates = 2, total 19,910 INR</text><path d='M 418 960 L 692 960' fill='none' stroke='#343a40' stroke-width='2' marker-end='url(#arrow)'/><text x='555.0' y='951' font-size='14' font-weight='600' fill='#343a40' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>all tool results</text><path d='M 692 1020 L 418 1020' fill='none' stroke='#7048e8' stroke-width='2' stroke-dasharray='7 5' marker-end='url(#arrow)'/><text x='555.0' y='1011' font-size='14' font-weight='600' fill='#7048e8' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>final answer: day plan, weather &quot;observed last year, not a live forecast&quot;, budget</text><rect x='160' y='1065' width='500' height='44' rx='8' fill='#fff5f5' stroke='#e03131' stroke-width='2'/><text x='410' y='1084' font-size='13.5' font-weight='600' fill='#c92a2a' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>GroundingGuard (after_model): 18 °C, 0 °C, -3 °C all match</text><text x='410' y='1101' font-size='13' font-weight='400' fill='#c92a2a' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>tool results → answer accepted (otherwise: back to the model)</text><path d='M 418 1155 L 1522 1155' fill='none' stroke='#343a40' stroke-width='2' marker-end='url(#arrow)'/><text x='970.0' y='1146' font-size='14' font-weight='600' fill='#343a40' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>answer + tool results  (plan() only)</text><path d='M 1522 1215 L 418 1215' fill='none' stroke='#0c8599' stroke-width='2' stroke-dasharray='7 5' marker-end='url(#arrow)'/><text x='970.0' y='1206' font-size='14' font-weight='600' fill='#0c8599' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>TripPlan JSON (weather_source = historical_proxy, caveats)</text><text x='970.0' y='1234' font-size='12.5' font-weight='400' fill='#495057' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>invalid JSON → repair prompt fallback</text><path d='M 402 1275 L 143 1275' fill='none' stroke='#343a40' stroke-width='2' stroke-dasharray='7 5' marker-end='url(#arrow)'/><text x='272.5' y='1266' font-size='14' font-weight='600' fill='#343a40' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>Markdown answer + tool trace + JSON itinerary</text><rect x='25' y='1315' width='1620' height='56' rx='8' fill='#ffffff' stroke='#adb5bd' stroke-width='2'/><text x='37' y='1339' font-size='13.5' font-weight='400' fill='#212529' text-anchor='start' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>Failure contract: a failed call returns {ok: false, error, hint} (ambiguous_place, place_not_found, weather_unavailable, rates_unavailable, no_data).</text><text x='37' y='1359' font-size='13.5' font-weight='400' fill='#212529' text-anchor='start' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>The LLM follows the hint: it retries with corrected arguments, asks the user, or states what could not be checked. It never sees a Python exception.</text></svg>